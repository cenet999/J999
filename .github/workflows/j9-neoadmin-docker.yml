name: J9 NeoAdmin Docker

run-name: J9 NeoAdmin Docker - ${{ github.ref_name }}@${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - J9_NeoAdmin/**
      - .github/workflows/j9-neoadmin-docker.yml
  pull_request:
    paths:
      - J9_NeoAdmin/**
      - .github/workflows/j9-neoadmin-docker.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/j9-neoadmin

jobs:
  build:
    name: 构建并推送 Docker 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备 .dockerignore
        run: cp J9_NeoAdmin/root-context.dockerignore .dockerignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: 构建 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: J9_NeoAdmin/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 直接打包仓库 j9-admin.css；禁用 publish 阶段缓存，避免旧层覆盖样式文件
          no-cache-filter: publish
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像信息
        if: github.event_name != 'pull_request'
        run: |
          echo "镜像已推送至: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "标签: ${{ steps.meta.outputs.tags }}"
          echo "部署: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
