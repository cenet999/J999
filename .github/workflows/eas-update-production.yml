name: EAS Update (Production OTA)
run-name: Production OTA - ${{ github.event.inputs.message || github.event.head_commit.message || github.sha }}

on:
  workflow_dispatch:
    inputs:
      message:
        description: OTA 更新说明
        required: false
        default: GitHub Actions OTA 更新
  push:
    branches:
      - main
    paths:
      - J9_APP_103/**
      - .github/workflows/eas-update-production.yml

jobs:
  update:
    name: 发布 production OTA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: J9_APP_103

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: J9_APP_103/pnpm-lock.yaml

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish OTA to production branch
        env:
          UPDATE_MESSAGE: ${{ github.event.inputs.message || github.event.head_commit.message || 'GitHub Actions OTA 更新' }}
        run: |
          eas update \
            --branch production \
            --environment production \
            --message "$UPDATE_MESSAGE" \
            --non-interactive

      - name: Bind production channel to production branch
        run: eas channel:edit production --branch production --non-interactive
        continue-on-error: true
