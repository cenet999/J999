name: J9 APP Docker

run-name: J9 APP Docker - ${{ github.ref_name }}@${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - J9_APP_103/**
      - .github/workflows/j9-app-docker.yml
  pull_request:
    paths:
      - J9_APP_103/**
      - .github/workflows/j9-app-docker.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/j9-app-web

jobs:
  build:
    name: 构建并推送 Web 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: 构建 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: J9_APP_103
          file: J9_APP_103/Dockerfile.web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=j9-app-web
          cache-to: type=gha,mode=max,scope=j9-app-web

      - name: 输出镜像信息
        if: github.event_name != 'pull_request'
        run: |
          echo "镜像已推送至: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "标签: ${{ steps.meta.outputs.tags }}"
